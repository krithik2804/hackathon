<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolicyLens AI - Advanced Analysis</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { opacity: 0, transform: 'translateY(20px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @keyframes scan {
            0%, 100% { top: 5%; }
            50% { top: 95%; }
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px -2px rgba(0,0,0,.05);
        }
        .card-elevated {
            background: #fff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.07), 0 12px 40px -4px rgba(0,0,0,.08);
        }
        .site-header {
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #e2e8f0;
        }
        .gradient-text {
            background: linear-gradient(135deg, #2563eb 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .input-field {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            color: #1e293b;
            transition: border-color .2s, box-shadow .2s;
        }
        .input-field:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
        .input-field::placeholder { color: #94a3b8; }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            color: #fff;
            box-shadow: 0 4px 14px -2px rgba(37,99,235,.35);
            transition: all .2s;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            box-shadow: 0 6px 20px -2px rgba(37,99,235,.45);
            transform: translateY(-1px);
        }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .btn-secondary {
            background: #fff;
            border: 1.5px solid #e2e8f0;
            color: #374151;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            transition: all .2s;
            cursor: pointer;
        }
        .btn-secondary:hover:not(:disabled) {
            border-color: #cbd5e1;
            box-shadow: 0 4px 12px rgba(0,0,0,.08);
            transform: translateY(-1px);
        }
        .badge-blue { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; }
        .step-card { transition: all .25s; cursor: default; }
        .step-card:hover { border-color: #bfdbfe; box-shadow: 0 8px 30px -4px rgba(37,99,235,.12); transform: translateY(-2px); }
        .option-selected { background: #eff6ff; border-color: #3b82f6 !important; color: #1d4ed8; }
        .option-unselected { background: #f8fafc; border-color: #e2e8f0; color: #374151; }
        .option-unselected:hover { border-color: #cbd5e1 !important; background: #f1f5f9; }
        .rec-card { background: linear-gradient(135deg, #eff6ff 0%, #eef2ff 100%); border: 1px solid #bfdbfe; }
        .modal-overlay { background: rgba(15,23,42,.4); backdrop-filter: blur(6px); }
        .chatbot-window { background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 20px 60px -8px rgba(0,0,0,.18); }
        .bubble-user { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; }
        .bubble-ai { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; }
        .log-terminal { background: #f8fafc; border: 1px solid #e2e8f0; color: #374151; }
        .scan-doc { background: #f1f5f9; border: 1.5px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
        .progress-track { background: #e2e8f0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        ::selection { background: rgba(59,130,246,.15); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const MOCK_POLICIES = [
            {
                id: 'pol_a', name: 'SecureCare Essential', insurer: 'SecureLife Corp', filename: 'Policy_A_SecureCare.pdf',
                data: {
                    plan_variants: { value: 'Base Plan (Also available: Gold, Platinum)', evidence: { quote: 'This document covers the Essential Base Plan. Gold and Platinum variants offer higher limits.', page: 1, section: 'PLAN TYPES' } },
                    coverage: { value: '\u20b95,00,000', numericValue: 500000, evidence: { quote: 'The base sum insured for this policy is \u20b95,00,000 per policy year.', page: 1, section: '1. SCHEDULE OF BENEFITS' } },
                    premium: { value: '\u20b98,500/yr', numericValue: 8500, evidence: { quote: 'Annual premium payable is \u20b98,500 inclusive of taxes.', page: 1, section: 'PREMIUM DETAILS' } },
                    waiting_period: { value: '30 days', numericValue: 30, evidence: { quote: 'A waiting period of 30 days applies to all illnesses.', page: 2, section: 'WAITING PERIOD' } },
                    deductible: { value: '\u20b95,000', numericValue: 5000, evidence: { quote: 'A mandatory deductible of \u20b95,000 applies.', page: 3, section: 'DEDUCTIBLES' } },
                    exclusions: { value: '\u2022 Cosmetic Procedures\n\u2022 Infertility Treatments\n\u2022 Non-medical Expenses\n\u2022 Experimental Treatments', list: [{ item: 'Cosmetic Procedures', evidence: { quote: 'Expenses related to cosmetic surgery are strictly excluded.', page: 4 } }] }
                }
            },
            {
                id: 'pol_b', name: 'HealthShield Plus', insurer: 'ShieldGroup', filename: 'Policy_B_ShieldPlus.pdf',
                data: {
                    plan_variants: { value: 'Standard / Single Plan', evidence: { quote: 'HealthShield Plus standard issuance.', page: 1, section: 'INTRODUCTION' } },
                    coverage: { value: '\u20b910,00,000', numericValue: 1000000, evidence: { quote: 'Total coverage limit under the plan is \u20b910,00,000.', page: 1, section: 'COVERAGE SUMMARY' } },
                    premium: { value: '\u20b910,200/yr', numericValue: 10200, evidence: { quote: 'The total annualized premium is calculated at \u20b910,200.', page: 2, section: 'PREMIUM COMPUTATION' } },
                    waiting_period: { value: '15 days', numericValue: 15, evidence: { quote: 'Initial waiting period is reduced to 15 days.', page: 3, section: 'SPECIAL CONDITIONS' } },
                    deductible: { value: 'None', numericValue: 0, evidence: { quote: 'This policy operates with a zero deductible feature.', page: 3, section: 'DEDUCTIBLES' } },
                    exclusions: { value: '\u2022 Pre-existing Diseases (24 months)\n\u2022 Self-inflicted injuries\n\u2022 Hazardous sports', list: [{ item: 'Pre-existing Diseases', evidence: { quote: 'Pre-existing conditions excluded for 24 months.', page: 5 } }] }
                }
            },
            {
                id: 'pol_c', name: 'MediSure Core', insurer: 'MediSure Group', filename: 'Policy_C_MediSure.pdf',
                data: {
                    plan_variants: { value: 'Core Tier (Also available: Comprehensive)', evidence: { quote: 'MediSure Core details described herein.', page: 1, section: 'COVERAGE' } },
                    coverage: { value: '\u20b97,50,000', numericValue: 750000, evidence: { quote: 'Maximum benefit amount is set to \u20b97,50,000.', page: 1, section: 'BENEFITS' } },
                    premium: { value: '\u20b97,500/yr', numericValue: 7500, evidence: { quote: 'Yearly premium is \u20b97,500.', page: 1, section: 'PREMIUM' } },
                    waiting_period: { value: 'UNCLEAR', numericValue: 9999, isUnclear: true, evidence: { quote: null, reason: 'No explicit waiting-period clause was found in the provided policy document.' } },
                    deductible: { value: '\u20b92,000', numericValue: 2000, evidence: { quote: 'Subject to a standard \u20b92,000 deductible.', page: 2, section: 'TERMS' } },
                    exclusions: { value: '\u2022 Intentional self-injury\n\u2022 War and nuclear risks\n\u2022 Unproven treatments', list: [{ item: 'Self-inflicted injuries', evidence: { quote: 'Intentional self-injury is not covered.', page: 4 } }] }
                }
            }
        ];

        const extractTextFromPDF = async (file) => {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";
                const maxPages = Math.min(pdf.numPages, 10);
                for (let i = 1; i <= maxPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    fullText += `\n--- [PAGE ${i}] ---\n${textContent.items.map(item => item.str).join(" ")}`;
                }
                return fullText;
            } catch (error) {
                console.error("PDF Extraction Error:", error);
                throw new Error("Failed to parse PDF document text.");
            }
        };

        const analyzePolicyWithAI = async (text) => {
            // HACKATHON: Replace with your Gemini API key from https://aistudio.google.com/
            const apiKey = "AQ.Ab8RN6LeerjHiFE_Lc9shkivQ5HdzaHxRI6DYigRZbzwC5hVng";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            
            const systemPrompt = `You are an expert insurance policy analyzer. Extract the following parameters strictly from the provided text.
            If a parameter is NOT explicitly found in the text, you MUST set isUnclear to true, value to 'UNCLEAR', and provide a reason in evidence.
            NEVER guess, infer, or hallucinate. Use exact quotes. Note the page number based on the [PAGE X] markers.
            CRITICAL FOR CURRENCY: All monetary values MUST include the Rupee symbol (e.g., '\u20b95,00,000').
            CRITICAL FOR MULTIPLE PLANS: If multiple tiers exist, extract the BASE/FIRST tier by default, and list all tiers in plan_variants.
            CRITICAL FOR PREMIUM: Look in 'Schedule of Benefits', 'Premium Computation', etc. If document has no actual price, mark as UNCLEAR.
            CRITICAL FOR EXCLUSIONS: Summarize major exclusions as bullet points using '\u2022 '. Separate with newlines.`;

            const responseSchema = {
                type: "OBJECT",
                properties: {
                    plan_variants: { type: "OBJECT", properties: { value: { type: "STRING" }, isUnclear: { type: "BOOLEAN" }, evidence: { type: "OBJECT", properties: { quote: { type: "STRING" }, page: { type: "NUMBER" }, section: { type: "STRING" }, reason: { type: "STRING" } } } } },
                    coverage: { type: "OBJECT", properties: { value: { type: "STRING" }, numericValue: { type: "NUMBER" }, isUnclear: { type: "BOOLEAN" }, evidence: { type: "OBJECT", properties: { quote: { type: "STRING" }, page: { type: "NUMBER" }, section: { type: "STRING" }, reason: { type: "STRING" } } } } },
                    premium: { type: "OBJECT", properties: { value: { type: "STRING" }, numericValue: { type: "NUMBER" }, isUnclear: { type: "BOOLEAN" }, evidence: { type: "OBJECT", properties: { quote: { type: "STRING" }, page: { type: "NUMBER" }, section: { type: "STRING" }, reason: { type: "STRING" } } } } },
                    waiting_period: { type: "OBJECT", properties: { value: { type: "STRING" }, numericValue: { type: "NUMBER" }, isUnclear: { type: "BOOLEAN" }, evidence: { type: "OBJECT", properties: { quote: { type: "STRING" }, page: { type: "NUMBER" }, section: { type: "STRING" }, reason: { type: "STRING" } } } } },
                    deductible: { type: "OBJECT", properties: { value: { type: "STRING" }, numericValue: { type: "NUMBER" }, isUnclear: { type: "BOOLEAN" }, evidence: { type: "OBJECT", properties: { quote: { type: "STRING" }, page: { type: "NUMBER" }, section: { type: "STRING" }, reason: { type: "STRING" } } } } },
                    exclusions: { type: "OBJECT", properties: { value: { type: "STRING" }, isUnclear: { type: "BOOLEAN" }, evidence: { type: "OBJECT", properties: { reason: { type: "STRING" } } } } }
                }
            };

            const payload = {
                contents: [{ parts: [{ text: text.substring(0, 50000) }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json", responseSchema }
            };

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.error) throw new Error(result.error.message || "API request failed. Check API key.");
                if (result.candidates && result.candidates[0].content) return JSON.parse(result.candidates[0].content.parts[0].text);
                throw new Error("Invalid AI response.");
            } catch (e) {
                console.error("AI Analysis failed:", e);
                throw e;
            }
        };

        const generateAIRecommendation = (profile, policies) => {
            if (!profile || policies.length === 0) return null;
            let scores = policies.map(p => ({ id: p.id, score: 0, reasons: [] }));
            let maxBudget = 999999;
            if (profile.budget === '\u20b95,000 and below') maxBudget = 5000;
            else if (profile.budget === '\u20b95,000\u2013\u20b910,000') maxBudget = 10000;
            else if (profile.budget === '\u20b910,000\u2013\u20b920,000') maxBudget = 20000;

            policies.forEach((policy, index) => {
                const data = policy.data;
                if (data.premium?.isUnclear) {
                    scores[index].score -= 10;
                    scores[index].reasons.push(`Risk: Cannot verify budget alignment (Premium data is UNCLEAR).`);
                } else if (data.premium?.numericValue <= maxBudget) {
                    scores[index].score += 10;
                    scores[index].reasons.push(`Fits well within your declared budget (${data.premium.value}).`);
                } else {
                    scores[index].score -= 5;
                    scores[index].reasons.push(`Exceeds your target budget parameter.`);
                }

                if (profile.priorities.includes('Coverage')) {
                    if (data.coverage?.isUnclear) {
                        scores[index].score -= 10;
                        scores[index].reasons.push(`Risk: Total coverage limit is UNCLEAR.`);
                    } else {
                        const validCovs = policies.filter(p => !p.data.coverage?.isUnclear).map(p => p.data.coverage.numericValue);
                        if (validCovs.length > 0 && data.coverage.numericValue === Math.max(...validCovs)) {
                            scores[index].score += 15;
                            scores[index].reasons.push(`Offers the highest coverage limit (${data.coverage.value}).`);
                        }
                    }
                }
                if (profile.priorities.includes('Waiting Period')) {
                    if (data.waiting_period?.isUnclear) {
                        scores[index].score -= 10;
                        scores[index].reasons.push(`Risk: Waiting period conditions are UNCLEAR.`);
                    } else {
                        const validWaits = policies.filter(p => !p.data.waiting_period?.isUnclear).map(p => p.data.waiting_period.numericValue);
                        if (validWaits.length > 0 && data.waiting_period.numericValue === Math.min(...validWaits)) {
                            scores[index].score += 15;
                            scores[index].reasons.push(`Features the shortest waiting period (${data.waiting_period.value}).`);
                        }
                    }
                }
            });

            scores.sort((a, b) => b.score - a.score);
            const bestMatch = policies.find(p => p.id === scores[0].id);
            return { policy: bestMatch, scoreDetails: scores[0] };
        };

        const Icons = {
            Brain: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Check: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" /></svg>,
            Shield: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            Alert: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            FileText: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
            Search: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Upload: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            Zap: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
            ChevronRight: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 5l7 7-7 7" /></svg>,
            User: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Download: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            Message: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>,
            Close: ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
        };

        /* ── Login ─────────────────────────────────────────────────── */
        const LoginScreen = ({ onLogin }) => (
            <div className="flex items-center justify-center min-h-[85vh] animate-slide-up px-4">
                <div className="card-elevated p-10 rounded-3xl w-full max-w-md">
                    <div className="flex justify-center mb-8">
                        <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                            <Icons.Shield className="w-10 h-10 text-blue-600" />
                        </div>
                    </div>
                    <h2 className="text-2xl font-bold text-center text-slate-900 mb-1">Welcome back</h2>
                    <p className="text-sm text-slate-400 text-center mb-8">Sign in to your PolicyLens account</p>
                    <form onSubmit={(e) => { e.preventDefault(); onLogin(); }} className="space-y-4">
                        <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1.5">Email address</label>
                            <input type="email" required placeholder="name@company.com" className="input-field w-full rounded-xl px-4 py-3 text-slate-900 text-sm" />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1.5">Password</label>
                            <input type="password" required placeholder="••••••••" className="input-field w-full rounded-xl px-4 py-3 text-slate-900 text-sm" />
                        </div>
                        <button type="submit" className="btn-primary w-full font-semibold py-3 rounded-xl text-sm mt-2">
                            Sign In →
                        </button>
                    </form>
                    <p className="mt-6 text-center text-xs text-slate-400">Educational prototype — any credentials will work.</p>
                </div>
            </div>
        );

        /* ── Landing ───────────────────────────────────────────────── */
        const LandingScreen = ({ onStart }) => (
            <div className="flex flex-col items-center justify-center min-h-[85vh] text-center px-4 py-16 animate-slide-up">
                <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full badge-blue text-sm font-medium mb-8">
                    <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse inline-block"></span>
                    Now supporting Health &amp; Vehicle Insurances
                </div>
                <h1 className="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight max-w-4xl leading-tight">
                    <span className="text-slate-900">Understand your </span>
                    <span className="gradient-text">insurance policy</span>
                    <br className="hidden sm:block" />
                    <span className="text-slate-600"> before you pay.</span>
                </h1>
                <p className="text-lg text-slate-500 mb-10 max-w-2xl font-light leading-relaxed">
                    Compare coverage, waiting periods, exclusions and premiums using evidence directly extracted from your policy documents.
                </p>
                <div className="flex gap-4 mb-16">
                    <button onClick={onStart} className="btn-primary px-8 py-4 rounded-xl font-semibold flex items-center gap-2 text-base">
                        Start Comparison <Icons.ChevronRight className="w-5 h-5" />
                    </button>
                </div>
                <div className="grid md:grid-cols-3 gap-6 max-w-5xl w-full text-left">
                    {[
                        { num: '01', Icon: Icons.User, title: 'Set Requirements', desc: 'Answer 3 simple questions about your budget, priorities, and who the policy is for.' },
                        { num: '02', Icon: Icons.Upload, title: 'Upload Policies', desc: 'Upload 2 to 3 Health or Vehicle insurance policy PDFs you want to compare side-by-side.' },
                        { num: '03', Icon: Icons.Zap, title: 'AI Analysis', desc: 'Our AI extracts exact clauses, highlights hidden exclusions, and generates a comparison matrix.' }
                    ].map(({ num, Icon, title, desc }) => (
                        <div key={num} className="card step-card p-6 rounded-2xl relative overflow-hidden">
                            <div className="absolute top-4 right-4 text-5xl font-black text-slate-100 select-none leading-none">{num}</div>
                            <div className="w-11 h-11 bg-blue-50 rounded-xl flex items-center justify-center border border-blue-100 mb-4">
                                <Icon className="w-5 h-5 text-blue-600" />
                            </div>
                            <h3 className="text-base font-bold text-slate-900 mb-1">{title}</h3>
                            <p className="text-slate-500 text-sm leading-relaxed">{desc}</p>
                        </div>
                    ))}
                </div>
            </div>
        );

        /* ── Questions ─────────────────────────────────────────────── */
        const QuestionsScreen = ({ onComplete }) => {
            const [step, setStep] = React.useState(0);
            const [profile, setProfile] = React.useState({ forWho: '', priorities: [], budget: '' });
            const [otherForWho, setOtherForWho] = React.useState('');
            const [otherPriority, setOtherPriority] = React.useState('');
            const [isOtherPrioritySelected, setIsOtherPrioritySelected] = React.useState(false);

            React.useEffect(() => {
                if (step === 0) { const t = setTimeout(() => setStep(1), 600); return () => clearTimeout(t); }
            }, [step]);

            const isStepValid = () => {
                if (step === 1) return (profile.forWho !== '' && profile.forWho !== 'Others') || (profile.forWho === 'Others' && otherForWho.trim() !== '');
                if (step === 2) return profile.priorities.length > 0 || (isOtherPrioritySelected && otherPriority.trim() !== '');
                if (step === 3) return profile.budget !== '';
                return false;
            };

            const handleNext = () => {
                let up = { ...profile };
                if (step === 1 && profile.forWho === 'Others') up.forWho = otherForWho;
                if (step === 2 && isOtherPrioritySelected && otherPriority.trim() && !up.priorities.includes(otherPriority))
                    up.priorities = [...up.priorities, otherPriority];
                setProfile(up);
                if (step < 3) setStep(step + 1);
                else onComplete(up);
            };

            return (
                <div className="max-w-2xl mx-auto mt-20 px-4 animate-slide-up w-full">
                    <div className="card-elevated rounded-3xl p-10 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 progress-track overflow-hidden rounded-t-3xl">
                            <div className="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-500" style={{ width: `${(step/3)*100}%` }}></div>
                        </div>
                        {step >= 1 && (
                            <div className="animate-fade-in mt-2">
                                <div className="text-xs font-bold text-blue-600 uppercase tracking-widest mb-3">Step {step} of 3</div>
                                <h3 className="text-2xl font-bold text-slate-900 mb-2">
                                    {step === 1 && "Who is this policy for?"}
                                    {step === 2 && "What matters most to you?"}
                                    {step === 3 && "What is your approximate annual budget?"}
                                </h3>
                                <p className="text-slate-400 text-sm mb-8 h-5">
                                    {step === 2 && "Select all that apply"}
                                </p>
                                <div className="grid gap-3">
                                    {step === 1 && <>
                                        {['Myself','Student','Family','Parents','Others'].map(opt => (
                                            <button key={opt} onClick={() => setProfile({...profile, forWho: opt})}
                                                className={`p-4 rounded-xl border-2 text-left transition-all font-medium text-sm ${profile.forWho===opt?'option-selected':'option-unselected'}`}>
                                                {opt}
                                            </button>
                                        ))}
                                        {profile.forWho==='Others' && (
                                            <div className="mt-1 animate-fade-in">
                                                <input type="text" autoFocus placeholder="Please specify who this is for..." value={otherForWho} onChange={e=>setOtherForWho(e.target.value)} className="input-field w-full rounded-xl px-4 py-3 text-slate-900 text-sm" />
                                            </div>
                                        )}
                                    </>}
                                    {step === 2 && <>
                                        {['Coverage','Waiting Period','Exclusions','Premium','Claim Conditions'].map(opt => {
                                            const isSel = profile.priorities.includes(opt);
                                            return (
                                                <button key={opt} onClick={() => {
                                                    const newP = isSel ? profile.priorities.filter(p=>p!==opt) : [...profile.priorities, opt];
                                                    setProfile({...profile, priorities: newP});
                                                }} className={`p-4 rounded-xl border-2 flex justify-between items-center transition-all font-medium text-sm ${isSel?'option-selected':'option-unselected'}`}>
                                                    <span>{opt}</span>
                                                    {isSel && <Icons.Check className="w-5 h-5 text-blue-500" />}
                                                </button>
                                            );
                                        })}
                                        <button onClick={()=>setIsOtherPrioritySelected(!isOtherPrioritySelected)}
                                            className={`p-4 rounded-xl border-2 flex justify-between items-center transition-all font-medium text-sm ${isOtherPrioritySelected?'option-selected':'option-unselected'}`}>
                                            <span>Others</span>
                                            {isOtherPrioritySelected && <Icons.Check className="w-5 h-5 text-blue-500" />}
                                        </button>
                                        {isOtherPrioritySelected && (
                                            <div className="mt-1 animate-fade-in">
                                                <input type="text" autoFocus placeholder="What else matters to you? (e.g. Co-pay, Network Hospitals)" value={otherPriority} onChange={e=>setOtherPriority(e.target.value)} className="input-field w-full rounded-xl px-4 py-3 text-slate-900 text-sm" />
                                            </div>
                                        )}
                                    </>}
                                    {step === 3 && ['\u20b95,000 and below','\u20b95,000\u2013\u20b910,000','\u20b910,000\u2013\u20b920,000','Above \u20b920,000'].map(opt => (
                                        <button key={opt} onClick={()=>setProfile({...profile,budget:opt})}
                                            className={`p-4 rounded-xl border-2 text-left transition-all font-medium text-sm ${profile.budget===opt?'option-selected':'option-unselected'}`}>
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                                <div className="mt-8 flex justify-end">
                                    <button onClick={handleNext} disabled={!isStepValid()}
                                        className={`px-6 py-3 rounded-xl font-semibold transition-all flex items-center gap-2 text-sm ${isStepValid()?'btn-primary':'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'}`}>
                                        {step===3?'Continue to Upload':'Next'} <Icons.ChevronRight className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        /* ── Upload ────────────────────────────────────────────────── */
        const UploadScreen = ({ onCustomUpload }) => {
            const [dragActive, setDragActive] = React.useState(false);
            const [files, setFiles] = React.useState([]);
            const inputRef = React.useRef(null);
            const handleDrag = (e) => { e.preventDefault(); e.stopPropagation(); setDragActive(e.type==="dragenter"||e.type==="dragover"); };
            const handleDrop = (e) => { e.preventDefault(); e.stopPropagation(); setDragActive(false); if(e.dataTransfer.files) processFiles(e.dataTransfer.files); };
            const processFiles = (nf) => { const pdfs=Array.from(nf).filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')); setFiles(prev=>[...prev,...pdfs].slice(0,3)); };

            return (
                <div className="max-w-4xl mx-auto mt-16 px-4 animate-slide-up w-full">
                    <div className="text-center mb-10">
                        <h2 className="text-3xl font-bold mb-2 text-slate-900">Upload Policies</h2>
                        <p className="text-slate-400 text-sm">Select 2 to 3 Health or Vehicle insurance policy PDFs to compare.</p>
                    </div>
                    <div className="grid md:grid-cols-5 gap-6">
                        <div className="md:col-span-3 card p-8 rounded-2xl flex flex-col">
                            <h3 className="text-base font-semibold text-slate-800 mb-5">Document Upload</h3>
                            <div className={`flex-1 min-h-[220px] flex flex-col items-center justify-center border-2 border-dashed rounded-xl p-8 text-center transition-all duration-300 cursor-pointer ${dragActive?'border-blue-400 bg-blue-50':'border-slate-300 bg-slate-50 hover:border-blue-300 hover:bg-blue-50/40'}`}
                                onDragEnter={handleDrag} onDragLeave={handleDrag} onDragOver={handleDrag} onDrop={handleDrop} onClick={()=>inputRef.current.click()}>
                                <input ref={inputRef} type="file" multiple accept=".pdf" onChange={e=>processFiles(e.target.files)} className="hidden" />
                                <div className={`p-4 rounded-full mb-4 transition-colors ${dragActive?'bg-blue-100':'bg-slate-100'}`}>
                                    <Icons.Upload className={`w-7 h-7 transition-colors ${dragActive?'text-blue-600':'text-slate-400'}`} />
                                </div>
                                <p className="text-slate-700 font-medium mb-1 text-sm">Click to browse or drag &amp; drop</p>
                                <p className="text-slate-400 text-xs">Maximum 3 PDF documents</p>
                            </div>
                            {files.length > 0 && (
                                <div className="mt-5 space-y-2.5">
                                    {files.map((file,idx) => (
                                        <div key={idx} className="bg-slate-50 border border-slate-200 p-3.5 rounded-xl flex items-center justify-between text-sm">
                                            <span className="text-slate-700 font-medium truncate max-w-[250px] flex items-center gap-2.5">
                                                <Icons.FileText className="w-4 h-4 text-blue-500 shrink-0"/> {file.name}
                                            </span>
                                            <button onClick={()=>setFiles(files.filter((_,i)=>i!==idx))} className="text-slate-400 hover:text-red-500 p-1.5 bg-white border border-slate-200 rounded-lg transition-colors ml-2 shrink-0"><Icons.Close className="w-3.5 h-3.5" /></button>
                                        </div>
                                    ))}
                                    <button onClick={()=>onCustomUpload(files)} disabled={files.length<2}
                                        className={`w-full py-3.5 rounded-xl font-semibold transition-all mt-2 text-sm ${files.length>=2?'btn-primary':'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'}`}>
                                        {files.length<2?`Add ${2-files.length} more ${2-files.length===1?'policy':'policies'} to compare`:'Run AI Analysis →'}
                                    </button>
                                </div>
                            )}
                        </div>
                        <div className="md:col-span-2 card p-7 rounded-2xl flex flex-col">
                            <h3 className="text-base font-semibold text-slate-800 mb-5 flex items-center gap-2"><Icons.Shield className="w-4 h-4 text-blue-500" /> Supported Types</h3>
                            <div className="space-y-4">
                                <div className="bg-green-50 border border-green-100 p-4 rounded-xl">
                                    <h4 className="text-green-700 font-semibold mb-1 flex items-center gap-2 text-sm"><Icons.Check className="w-4 h-4" /> Health Insurance</h4>
                                    <p className="text-xs text-slate-500 leading-relaxed">Comprehensive health plans, family floaters, senior citizen plans, and critical illness policies.</p>
                                </div>
                                <div className="bg-green-50 border border-green-100 p-4 rounded-xl">
                                    <h4 className="text-green-700 font-semibold mb-1 flex items-center gap-2 text-sm"><Icons.Check className="w-4 h-4" /> Vehicle Insurance</h4>
                                    <p className="text-xs text-slate-500 leading-relaxed">Two-wheeler and four-wheeler comprehensive motor insurance policies.</p>
                                </div>
                                <div className="bg-red-50 border border-red-100 p-4 rounded-xl">
                                    <h4 className="text-red-600 font-semibold mb-1 flex items-center gap-2 text-sm"><Icons.Alert className="w-4 h-4" /> Unsupported</h4>
                                    <p className="text-xs text-slate-500 leading-relaxed">Life insurance, ULIPs, property, and corporate group policies are currently not supported by the AI engine.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* ── Analysis Loader ───────────────────────────────────────── */
        const AnalysisLoader = ({ onComplete, files }) => {
            const [logs, setLogs] = React.useState([]);
            React.useEffect(() => {
                if (files && files.length > 0) processRealFiles();
                else runMockAnalysis();
            }, []);

            const runMockAnalysis = () => {
                const steps = ["Initializing document parser...","✓ Secure connection established","Scanning Document A for clauses and tiers...","✓ Extracted financial terms (Coverage & Premium)","Scanning Document B for inclusions...","✓ Validated legal evidence and quotes","Scanning Document C...","✓ Cross-referencing waiting periods [Incomplete Data Found]","Generating comparison matrix...","Analysis Complete"];
                let i=0;
                const intv = setInterval(()=>{
                    if(i<steps.length){setLogs(prev=>[...prev,steps[i]]); i++;}
                    else{clearInterval(intv); setTimeout(()=>onComplete(MOCK_POLICIES),500);}
                },400);
            };

            const processRealFiles = async () => {
                const results=[];
                for(let i=0; i<files.length; i++){
                    const file=files[i];
                    try {
                        setLogs(prev=>[...prev,`[${file.name}] Reading PDF architecture...`]);
                        const text=await extractTextFromPDF(file);
                        setLogs(prev=>[...prev,`[${file.name}] ✓ Extracted text layout`]);
                        setLogs(prev=>[...prev,`[${file.name}] AI isolating plan variants & clauses...`]);
                        const extractedData=await analyzePolicyWithAI(text);
                        setLogs(prev=>[...prev,`[${file.name}] ✓ Validation complete`]);
                        results.push({id:`custom_${i}`,name:file.name.replace('.pdf',''),insurer:'Uploaded Policy',filename:file.name,data:extractedData});
                    } catch(e){
                        setLogs(prev=>[...prev,`❌ Error on ${file.name}. Check API Key.`]);
                        const unclear={value:'UNCLEAR',isUnclear:true,evidence:{reason:"Extraction failed. Ensure API key is valid."}};
                        results.push({id:`custom_${i}`,name:file.name.replace('.pdf',''),insurer:'Unknown',filename:file.name,data:{plan_variants:unclear,coverage:{...unclear},premium:{...unclear},waiting_period:{...unclear},deductible:{...unclear},exclusions:{...unclear}}});
                    }
                }
                setLogs(prev=>[...prev,"Executive Summary Generated"]);
                setTimeout(()=>onComplete(results),500);
            };

            return (
                <div className="max-w-md mx-auto mt-32 px-4 animate-slide-up w-full">
                    <div className="card-elevated p-10 rounded-3xl text-center">
                        <div className="relative w-20 h-28 scan-doc rounded-xl mx-auto mb-8 overflow-hidden">
                            <div className="absolute top-4 left-4 right-4 h-1.5 bg-slate-200 rounded"></div>
                            <div className="absolute top-8 left-4 right-8 h-1.5 bg-slate-200 rounded"></div>
                            <div className="absolute top-12 left-4 right-4 h-1.5 bg-slate-200 rounded"></div>
                            <div className="absolute top-16 left-4 right-10 h-1.5 bg-slate-200 rounded"></div>
                            <div className="absolute top-20 left-4 right-4 h-1.5 bg-slate-200 rounded"></div>
                            <div className="absolute left-0 right-0 h-0.5 bg-blue-500" style={{boxShadow:'0 0 10px rgba(59,130,246,0.6)',animation:'scan 2s ease-in-out infinite'}}></div>
                        </div>
                        <h3 className="text-xl font-bold text-slate-900 mb-1">Processing Documents</h3>
                        <p className="text-sm text-slate-400 mb-6">AI is extracting and validating policy clauses</p>
                        <div className="log-terminal text-xs h-40 overflow-y-auto text-left p-4 rounded-xl space-y-1.5" style={{fontFamily:"'JetBrains Mono', monospace"}}>
                            {logs.length===0 && <span className="text-slate-400">Initializing...</span>}
                            {logs.map((log,idx)=>(
                                <div key={idx} className={`flex items-start gap-2 ${log.includes('✓')?'text-emerald-600':log.includes('❌')||log.includes('Incomplete')?'text-amber-600':'text-slate-600'}`}>
                                    <span className="opacity-40 text-[10px] shrink-0 mt-px">[{new Date().toLocaleTimeString().split(' ')[0]}]</span> {log}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        /* ── Chatbot ───────────────────────────────────────────────── */
        const PolicyChatbot = ({ policies, profile }) => {
            const [isOpen, setIsOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([{ role:'model', text:"Analysis complete! I can explain waiting periods, exclusions, or any specific clauses. What would you like to know?" }]);
            const [input, setInput] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);
            const endRef = React.useRef(null);
            React.useEffect(()=>{ if(endRef.current) endRef.current.scrollIntoView({behavior:'smooth'}); },[messages,isOpen]);

            const handleSend = async (e) => {
                e.preventDefault();
                if(!input.trim()||isLoading) return;
                const userMsg=input.trim(); setInput('');
                setMessages(prev=>[...prev,{role:'user',text:userMsg}]);
                setIsLoading(true);
                const apiKey="AQ.Ab8RN6LeerjHiFE_Lc9shkivQ5HdzaHxRI6DYigRZbzwC5hVng";
                const apiUrl=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                const systemPrompt=`You are the PolicyLens Assistant. Answer questions based ONLY on the following extracted policy data and user profile. If data is UNCLEAR, say so. Keep answers concise and use bullet points.\n\nData: ${JSON.stringify(policies)}\nProfile: ${JSON.stringify(profile)}`;
                const chatHistory=messages.map(m=>({role:m.role==='model'?'model':'user',parts:[{text:m.text}]}));
                chatHistory.push({role:'user',parts:[{text:userMsg}]});
                try{
                    const res=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:chatHistory,systemInstruction:{parts:[{text:systemPrompt}]}})});
                    const data=await res.json();
                    const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||"Sorry, I encountered an error.";
                    setMessages(prev=>[...prev,{role:'model',text:reply}]);
                }catch(err){
                    setMessages(prev=>[...prev,{role:'model',text:"Network error communicating with AI."}]);
                }
                setIsLoading(false);
            };

            if(!isOpen) return (
                <button onClick={()=>setIsOpen(true)} className="fixed bottom-6 right-6 btn-primary p-4 rounded-full flex items-center gap-2 group z-50">
                    <Icons.Message className="w-5 h-5" />
                    <span className="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-300 ease-in-out font-medium pr-1 text-sm">Ask AI</span>
                </button>
            );

            return (
                <div className="fixed bottom-6 right-6 w-96 max-w-[calc(100vw-32px)] chatbot-window rounded-2xl flex flex-col h-[520px] z-50 overflow-hidden animate-slide-up">
                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-white">
                        <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
                                <Icons.Brain className="w-4 h-4 text-white" />
                            </div>
                            <div>
                                <div className="font-semibold text-slate-900 text-sm">PolicyLens AI</div>
                                <div className="text-xs text-emerald-500 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Online</div>
                            </div>
                        </div>
                        <button onClick={()=>setIsOpen(false)} className="text-slate-400 hover:text-slate-700 p-1.5 hover:bg-slate-100 rounded-lg transition-colors"><Icons.Close className="w-4 h-4" /></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
                        {messages.map((msg,i)=>(
                            <div key={i} className={`flex ${msg.role==='user'?'justify-end':'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm whitespace-pre-wrap leading-relaxed ${msg.role==='user'?'bubble-user rounded-br-none':'bubble-ai rounded-bl-none'}`}>{msg.text}</div>
                            </div>
                        ))}
                        {isLoading && (
                            <div className="flex justify-start">
                                <div className="bubble-ai rounded-2xl rounded-bl-none px-4 py-3 flex gap-1 items-center">
                                    <span className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:'0ms'}}></span>
                                    <span className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:'150ms'}}></span>
                                    <span className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay:'300ms'}}></span>
                                </div>
                            </div>
                        )}
                        <div ref={endRef} />
                    </div>
                    <form onSubmit={handleSend} className="p-3 bg-white border-t border-slate-100 flex gap-2">
                        <input type="text" value={input} onChange={e=>setInput(e.target.value)} placeholder="Ask about these policies..." className="input-field flex-1 rounded-xl px-3 py-2.5 text-sm" />
                        <button type="submit" disabled={isLoading||!input.trim()} className="btn-primary px-3 py-2 rounded-xl transition-all"><Icons.ChevronRight className="w-5 h-5" /></button>
                    </form>
                </div>
            );
        };

        /* ── Comparison Screen ─────────────────────────────────────── */
        const ComparisonScreen = ({ profile, policiesData }) => {
            const [selectedEvidence, setSelectedEvidence] = React.useState(null);
            const [isExporting, setIsExporting] = React.useState(false);
            const aiRec = React.useMemo(()=>generateAIRecommendation(profile, policiesData),[profile,policiesData]);

            const exportToPDF = async () => {
                if(isExporting) return;
                setIsExporting(true);
                try {
                    const el=document.getElementById('report-export-container');
                    const canvas=await html2canvas(el,{scale:2,useCORS:true,logging:false,backgroundColor:'#ffffff'});
                    const imgData=canvas.toDataURL('image/png');
                    const pdf=new jspdf.jsPDF('p','mm','a4');
                    const w=pdf.internal.pageSize.getWidth();
                    const h=(canvas.height*w)/canvas.width;
                    pdf.addImage(imgData,'PNG',0,0,w,h);
                    pdf.save('PolicyLens_Analysis_Report.pdf');
                } catch(e){ console.error("PDF Export failed",e); }
                setIsExporting(false);
            };

            const renderCell = (policy, key, label) => {
                const item=policy.data[key];
                if(!item) return <td key={policy.id} className="p-4 border border-slate-200 text-slate-400 text-xs align-top">N/A</td>;
                return (
                    <td key={policy.id} className="p-4 border border-slate-200 hover:bg-blue-50/30 transition-colors align-top min-w-[160px]">
                        <div className="flex flex-col gap-2 items-start">
                            {item.isUnclear ? (
                                <span className="inline-flex items-center gap-1 bg-red-50 text-red-600 border border-red-100 px-2.5 py-1 rounded-lg text-xs font-semibold">
                                    <Icons.Alert className="w-3.5 h-3.5" /> Unclear
                                </span>
                            ) : (
                                <div className="text-slate-800 font-medium text-sm whitespace-pre-line leading-relaxed">{item.value}</div>
                            )}
                            <button onClick={()=>setSelectedEvidence({fieldName:label,policyName:policy.name,...item})}
                                className="text-left text-xs font-medium text-blue-600 hover:text-blue-800 flex items-center gap-1 transition-colors bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-lg">
                                <Icons.Search className="w-3 h-3" /> Evidence
                            </button>
                        </div>
                    </td>
                );
            };

            return (
                <div className="max-w-6xl mx-auto mt-8 px-4 pb-24 animate-fade-in w-full">
                    <div className="flex justify-between items-end mb-8">
                        <div>
                            <h2 className="text-3xl font-bold text-slate-900 mb-1">Policy Comparison</h2>
                            <p className="text-slate-400 text-sm">Data extracted directly from source documents.</p>
                        </div>
                        <button onClick={exportToPDF} disabled={isExporting} className="hidden md:flex items-center gap-2 btn-secondary px-4 py-2.5 rounded-xl text-sm font-medium">
                            <Icons.Download className="w-4 h-4" /> {isExporting?'Generating...':'Download Report'}
                        </button>
                    </div>

                    <div id="report-export-container" className="space-y-6">
                        {aiRec && (
                            <div className="rec-card rounded-2xl p-6">
                                <div className="flex flex-col md:flex-row gap-5 items-start">
                                    <div className="bg-white p-3.5 rounded-xl border border-blue-100 shadow-sm shrink-0">
                                        <Icons.Brain className="w-7 h-7 text-blue-600" />
                                    </div>
                                    <div>
                                        <div className="text-xs font-bold text-blue-600 tracking-widest uppercase mb-1">AI Recommendation</div>
                                        <h3 className="text-xl font-bold text-slate-900 mb-3">
                                            {aiRec.scoreDetails.score < 0 ? 'Review Required — ' : 'Best Match: '}
                                            <span className="text-blue-700">{aiRec.policy.name}</span>
                                        </h3>
                                        <ul className="space-y-2">
                                            {aiRec.scoreDetails.reasons.map((r,i)=>(
                                                <li key={i} className={`flex items-start gap-2 text-sm ${r.startsWith('Risk')?'text-red-700':'text-slate-700'}`}>
                                                    {r.startsWith('Risk')?<Icons.Alert className="w-4 h-4 text-red-500 shrink-0 mt-0.5"/>:<Icons.Check className="w-4 h-4 text-emerald-500 shrink-0 mt-0.5"/>}
                                                    {r}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="card rounded-2xl overflow-hidden relative">
                            <div className="md:hidden absolute top-0 right-0 h-full w-8 bg-gradient-to-l from-white to-transparent pointer-events-none z-30"></div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[500px]">
                                    <thead>
                                        <tr>
                                            <th className="p-5 font-semibold text-xs tracking-wider text-slate-500 uppercase w-36 border border-slate-200 bg-slate-50 sticky left-0 z-20" style={{boxShadow:'2px 0 8px rgba(0,0,0,0.04)'}}>Feature</th>
                                            {policiesData.map(p=>(
                                                <th key={p.id} className="p-5 border border-slate-200 relative bg-white min-w-[160px]">
                                                    <div className="font-bold text-slate-900 text-base leading-tight">{p.name}</div>
                                                    <div className="text-xs text-slate-400 mt-0.5">{p.insurer}</div>
                                                    {p.id===aiRec?.policy.id && <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>}
                                                </th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {['plan_variants','coverage','premium','waiting_period','deductible','exclusions'].map(key=>{
                                            const label=key.replace('_',' ');
                                            const isPriority=profile?.priorities?.some(p=>p.toLowerCase().includes(label.toLowerCase()));
                                            return (
                                                <tr key={key} className={isPriority?'bg-blue-50/40':'bg-white'}>
                                                    <td className="p-4 text-xs font-semibold text-slate-600 border border-slate-200 bg-slate-50 sticky left-0 z-10 capitalize align-top" style={{boxShadow:'2px 0 8px rgba(0,0,0,0.04)'}}>
                                                        <div className="flex flex-col gap-1.5">
                                                            {label}
                                                            {isPriority && <span className="px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 text-[9px] uppercase font-bold tracking-wider w-fit">Priority</span>}
                                                        </div>
                                                    </td>
                                                    {policiesData.map(p=>renderCell(p,key,label))}
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <PolicyChatbot policies={policiesData} profile={profile} />

                    {selectedEvidence && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-[100] animate-fade-in" onClick={()=>setSelectedEvidence(null)}>
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden" onClick={e=>e.stopPropagation()}>
                                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                                    <div>
                                        <h3 className="text-blue-600 uppercase tracking-widest text-xs font-bold">{selectedEvidence.fieldName}</h3>
                                        <p className="text-slate-900 font-semibold mt-0.5">{selectedEvidence.policyName}</p>
                                    </div>
                                    <button onClick={()=>setSelectedEvidence(null)} className="text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 p-2 rounded-xl transition-colors"><Icons.Close className="w-4 h-4" /></button>
                                </div>
                                <div className="p-6">
                                    {selectedEvidence.isUnclear ? (
                                        <div className="bg-red-50 border border-red-100 rounded-xl p-5">
                                            <div className="flex items-center gap-2 text-red-600 mb-3 font-semibold text-sm"><Icons.Alert className="w-5 h-5" /> Missing Data</div>
                                            <p className="text-slate-600 text-sm leading-relaxed mb-4">{selectedEvidence.evidence?.reason||"No explicit clause was found in the provided policy document."}</p>
                                            <div className="text-xs text-red-600/80 bg-red-50 p-3 rounded-lg border border-red-100">To prevent hallucination, the AI is restricted from guessing or inferring missing policy terms.</div>
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="mb-5">
                                                <span className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2 mb-3"><Icons.FileText className="w-4 h-4" /> Source Extraction</span>
                                                <div className="border-l-2 border-blue-400 pl-4 py-2 bg-blue-50/40 rounded-r-lg">
                                                    <p className="text-slate-700 text-sm leading-relaxed italic">&ldquo;{selectedEvidence.evidence?.quote}&rdquo;</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-6 text-xs font-medium text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                <div><span className="text-slate-400">Page: </span><span className="text-slate-700 font-semibold">{selectedEvidence.evidence?.page||1}</span></div>
                                                <div className="w-px bg-slate-200"></div>
                                                <div><span className="text-slate-400">Section: </span><span className="text-slate-700 font-semibold">{selectedEvidence.evidence?.section||"General"}</span></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        /* ── App Root ──────────────────────────────────────────────── */
        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [currentStep, setCurrentStep] = React.useState('login');
            const [profile, setProfile] = React.useState(null);
            const [activePolicies, setActivePolicies] = React.useState([]);
            const [customFiles, setCustomFiles] = React.useState(null);

            const handleLogin = () => { setIsLoggedIn(true); setCurrentStep('landing'); };
            const handleLogout = () => { setIsLoggedIn(false); setCurrentStep('login'); setProfile(null); setActivePolicies([]); setCustomFiles(null); };

            return (
                <div className="flex flex-col min-h-screen" style={{background:'#f8fafc',color:'#1e293b'}}>
                    <header className="site-header sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer group" onClick={()=>isLoggedIn&&setCurrentStep('landing')}>
                                <div className="p-1.5 bg-blue-50 rounded-lg border border-blue-100 group-hover:bg-blue-100 transition-colors">
                                    <Icons.Shield className="w-5 h-5 text-blue-600" />
                                </div>
                                <span className="font-bold text-lg tracking-tight text-slate-900">PolicyLens</span>
                                <span className="text-xs font-bold text-blue-600 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-full">AI</span>
                            </div>
                            {isLoggedIn && (
                                <div className="flex items-center gap-4">
                                    {currentStep !== 'landing' && (
                                        <button onClick={()=>setCurrentStep('landing')} className="text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">Start Over</button>
                                    )}
                                    <div className="w-px h-4 bg-slate-200"></div>
                                    <button onClick={handleLogout} className="text-sm font-medium text-red-500 hover:text-red-700 transition-colors">Sign out</button>
                                </div>
                            )}
                        </div>
                    </header>
                    <main className="flex-grow flex flex-col relative w-full items-center">
                        {currentStep==='login' && <LoginScreen onLogin={handleLogin} />}
                        {currentStep==='landing' && <LandingScreen onStart={()=>setCurrentStep('questions')} />}
                        {currentStep==='questions' && <QuestionsScreen onComplete={(prof)=>{setProfile(prof); setCurrentStep('upload');}} />}
                        {currentStep==='upload' && <UploadScreen onCustomUpload={(files)=>{setCustomFiles(Array.from(files)); setCurrentStep('analyzing');}} />}
                        {currentStep==='analyzing' && <AnalysisLoader onComplete={(results)=>{setActivePolicies(results); setCurrentStep('results');}} files={customFiles} />}
                        {currentStep==='results' && <ComparisonScreen profile={profile} policiesData={activePolicies} />}
                    </main>
                    <footer className="text-center py-6 text-xs text-slate-400 border-t border-slate-100 font-medium">
                        Educational comparison tool &mdash; not insurance advice or a licensed insurance sale.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
